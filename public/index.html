<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>remotecam</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">remote<span>cam</span></div>
    <button id="monitorBtn" class="monitor-btn" disabled>Monitor</button>
    <div class="status-pill" id="statusPill">
      <span class="dot"></span>
      <span class="status-text">No camera</span>
    </div>
  </header>

  <div class="preview-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="empty-state" id="emptyState">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M23 7l-7 5 7 5V7z"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
      <p>Select your iPhone from the camera list below</p>
    </div>
    <div class="timer" id="timer">00:00</div>
    <div class="monitor-overlay hidden" id="monitorOverlay">
      <div class="monitor-released">
        <p>iPhone camera released</p>
        <p class="monitor-sub">Open Camera app on iPhone to record &rarr; retrieve via AirDrop</p>
      </div>
      <div class="monitor-bar">
        <button id="fullscreenBtn">Fullscreen</button>
        <button id="exitMonitorBtn">Exit Monitor</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="select-wrap">
      <select id="cameraSelect">
        <option value="">Loading cameras...</option>
      </select>
    </div>
    <button id="recordBtn" disabled>Record</button>
  </div>

  <div class="cam-controls hidden" id="camControls">
    <div class="cam-control">
      <label>Quality preset</label>
      <div class="preset-btns">
        <button class="preset-btn" data-preset="wifi">WiFi</button>
        <button class="preset-btn active" data-preset="standard">Standard</button>
        <button class="preset-btn" data-preset="high">High</button>
      </div>
    </div>

    <div class="cam-control" id="resolutionWrap">
      <label for="resolutionSelect">Resolution</label>
      <div class="select-wrap">
        <select id="resolutionSelect">
          <option value="3840x2160">4K (2160p)</option>
          <option value="1920x1080" selected>1080p</option>
          <option value="1280x720">720p</option>
        </select>
      </div>
    </div>

    <div class="cam-control" id="fpsWrap">
      <label for="fpsSelect">Frame rate</label>
      <div class="select-wrap">
        <select id="fpsSelect">
          <option value="60">60 fps</option>
          <option value="30" selected>30 fps</option>
          <option value="24">24 fps</option>
        </select>
      </div>
    </div>

    <div class="cam-control" id="zoomWrap" style="display:none;"><!-- shown by JS once stream is active -->
      <label for="zoomRange">Zoom <span id="zoomVal">1×</span></label>
      <input type="range" id="zoomRange" min="1" max="5" step="0.1" value="1" />
    </div>

    <div class="cam-control">
      <label>Orientation</label>
      <div class="orient-btns">
        <button class="orient-btn active" id="orientLandscape" data-orient="landscape">Landscape</button>
        <button class="orient-btn" id="orientPortrait" data-orient="portrait">Portrait</button>
      </div>
    </div>

    <div class="cam-control">
      <label>Audio</label>
      <button class="toggle-btn" id="audioToggle" aria-pressed="false">Off</button>
    </div>

    <div class="cam-control hidden" id="micWrap">
      <label for="micSelect">Microphone</label>
      <div class="select-wrap">
        <select id="micSelect"></select>
      </div>
    </div>
  </div>

  <div class="recordings hidden" id="recordings">
    <div class="recordings-header">
      <h2>Recordings</h2>
      <button class="clear-btn" id="clearAllBtn">Clear all</button>
    </div>
    <div class="recordings-list" id="recordingsList"></div>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="previewModal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle"></span>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <video class="modal-video" id="modalVideo" controls></video>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
