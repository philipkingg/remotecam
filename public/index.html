<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>remotecam</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">remote<span>cam</span></div>
    <div class="status-pill" id="statusPill">
      <span class="dot"></span>
      <span class="status-text">No camera</span>
    </div>
  </header>

  <div class="preview-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="empty-state" id="emptyState">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M23 7l-7 5 7 5V7z"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
      <p>Select your iPhone from the camera list below</p>
    </div>
    <div class="timer" id="timer">00:00</div>
  </div>

  <div class="controls">
    <div class="select-wrap">
      <select id="cameraSelect">
        <option value="">Loading cameras...</option>
      </select>
    </div>
    <button id="recordBtn" disabled>Record</button>
  </div>

  <div class="cam-controls hidden" id="camControls">
    <div class="cam-control" id="resolutionWrap">
      <label for="resolutionSelect">Resolution</label>
      <div class="select-wrap">
        <select id="resolutionSelect">
          <option value="3840x2160">4K (2160p)</option>
          <option value="1920x1080" selected>1080p</option>
          <option value="1280x720">720p</option>
        </select>
      </div>
    </div>

    <div class="cam-control" id="fpsWrap">
      <label for="fpsSelect">Frame rate</label>
      <div class="select-wrap">
        <select id="fpsSelect">
          <option value="60">60 fps</option>
          <option value="30" selected>30 fps</option>
          <option value="24">24 fps</option>
        </select>
      </div>
    </div>

    <div class="cam-control" id="zoomWrap" style="display:none">
      <label for="zoomRange">Zoom <span id="zoomVal">1×</span></label>
      <input type="range" id="zoomRange" min="1" max="5" step="0.1" value="1" />
    </div>

    <div class="cam-control">
      <label>Audio</label>
      <button class="toggle-btn" id="audioToggle" aria-pressed="false">Off</button>
    </div>
  </div>

  <div class="recordings hidden" id="recordings">
    <div class="recordings-header">
      <h2>Recordings</h2>
      <button class="clear-btn" id="clearAllBtn">Clear all</button>
    </div>
    <div class="recordings-list" id="recordingsList"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
