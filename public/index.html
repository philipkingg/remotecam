<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>remotecam</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">remote<span>cam</span></div>
    <div class="status-pill" id="statusPill">
      <span class="dot"></span>
      <span class="status-text">No camera</span>
    </div>
  </header>

  <div class="preview-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="empty-state" id="emptyState">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M23 7l-7 5 7 5V7z"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
      <p>Select your iPhone from the camera list below</p>
    </div>
    <div class="timer" id="timer">00:00</div>
  </div>

  <div class="controls">
    <div class="select-wrap">
      <select id="cameraSelect">
        <option value="">Loading cameras...</option>
      </select>
    </div>
    <button id="recordBtn" disabled>Record</button>
  </div>

  <div class="recordings hidden" id="recordings">
    <h2>Recordings</h2>
    <div class="recordings-list" id="recordingsList"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
